<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Phaser 3 2D Side Scroller</title>
    <!-- Phaser 3 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    
    <style>
        /* 기본 여백 제거 및 배경색 검은색 지정 */
        body {
            margin: 0;
            padding: 0;
            background-color: #121212; /* 완전한 검은색(#000)보다 눈이 더 편한 어두운 회색 계열 */
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden; /* 스크롤바 방지 */
        }

        /* Phaser Canvas 테두리와 그림자 효과 (선택 사항) */
        canvas {
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <script type="module" src="./src/main.js"></script>
</body>
<style>
    html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #121212;
        overflow: hidden; /* 스크롤바 방지 */
    }
</style>
</html>
